name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PEBBLE_TOOL_VERSION: "5.1.2"
  PEBBLE_SDK_VERSION: "4.44"

jobs:
  release:
    name: Build and publish .pbw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run tests
        run: node --test 'tests/**/*.test.cjs'

      # The tag must match the version in package.json (v1.1.1 <-> 1.1.1).
      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6

      - name: Fetch pebble-ui submodule
        run: git submodule update --init --depth 1

      - name: Install pebble-tool
        run: uv tool install --python 3.13 "pebble-tool==${PEBBLE_TOOL_VERSION}"

      # pebble-tool creates this folder with a non-atomic exists/makedirs check
      # that can crash with FileExistsError; creating it up front avoids that.
      - name: Prepare Pebble SDK folder
        run: mkdir -p ~/.local/share/pebble-sdk/oauth_firebase

      # The cache includes the SDKs/current symlink, so a restored SDK is
      # already active and needs no `pebble sdk activate`.
      - name: Cache Pebble SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pebble-sdk/SDKs
          key: pebble-sdk-${{ runner.os }}-${{ env.PEBBLE_SDK_VERSION }}

      - name: Install Pebble SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: pebble sdk install "${PEBBLE_SDK_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: pebble build

      # Uses the matching CHANGELOG.md section as the release notes and falls
      # back to generated notes if there is none.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            /^## / { if (found) exit; found = index($0, "## " v " ") == 1 || $0 == "## " v; next }
            found
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" build/*.pbw \
            --title "CarGlance ${GITHUB_REF_NAME}" \
            "${notes[@]}"
